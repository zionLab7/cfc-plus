name: Publish versioned images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_run:
    workflows: ['Verify']
    types: [completed]
    branches: [main]
concurrency:
  group: cfc-versioned-publish
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  release-check:
    # Only trusted main pushes may promote a successful Verify run.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('CfcPilot.csproj','utf8').match(/<Version>([^<]+)<\/Version>/)?.[1];
            if (!version || !/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const tag = 'v' + version;
            if (context.eventName === 'push' && context.ref.startsWith('refs/tags/') && context.ref !== 'refs/tags/' + tag)
              throw new Error('Tag and project version differ');
            try {
              const release = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              const installer = 'CFC-Plus-Instalador-' + version + '-x64.exe';
              const names = release.data.assets.map(a => a.name);
              if (!names.includes(installer) || !names.includes(installer + '.sha256'))
                throw new Error('Release exists without complete assets; repair explicitly rather than overwrite a distributed version');
              core.notice('Version already distributed; images and installer will not be overwritten.');
              core.setOutput('publish','false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish','true');
            }
  publish:
    needs: release-check
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/PilotStackChecks.cjs
      - run: dotnet build --nologo
      - run: dotnet bin/Debug/net10.0/CfcPilot.dll --self-test-finance
      - run: dotnet bin/Debug/net10.0/CfcPilot.dll --self-test-commercial
      - run: dotnet bin/Debug/net10.0/CfcPilot.dll --self-test-student-dedup
      - run: node tests/central-http.mjs
      - run: dotnet bin/Debug/net10.0/CfcPilot.dll --self-test-community
      - name: Build and verify Linux browser
        run: |
          docker build --target browser-check -t cfc-browser-test .
          docker run --rm --init --shm-size=1g --security-opt seccomp=infra/production/chromium-seccomp.json -e CFC_TEST_USERNS=1 --entrypoint xvfb-run cfc-browser-test -a node /app/tools/NativePortalChecks.cjs /tmp/native-check /opt/electron/electron
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "value=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' CfcPilot.csproj)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/cfc-plus:${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: browser
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/cfc-plus:${{ steps.version.outputs.value }}-browser

  windows-release:
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop
      - run: node --test tests/*.test.cjs
        working-directory: desktop
      - name: Verify local Windows portal persistence
        shell: pwsh
        run: |
          $taskFolder = Join-Path $env:RUNNER_TEMP ("cfc-local-" + [guid]::NewGuid().ToString("N"))
          $taskRuntime = Join-Path $pwd "desktop/node_modules/electron/dist/electron.exe"
          foreach ($taskStage in @("seed", "restore")) {
            $taskProcess = Start-Process -FilePath $taskRuntime -ArgumentList @("tools/LocalPortalChecks.cjs", $taskFolder, $taskStage) -WindowStyle Hidden -PassThru -Wait
            if ($taskProcess.ExitCode -ne 0) { throw "Local portal $taskStage failed" }
            $taskResult = Get-Content (Join-Path $taskFolder "$taskStage-result.json") -Raw | ConvertFrom-Json
            if (-not $taskResult.ok) { throw $taskResult.error }
            Write-Output "Local portal $taskStage verified: $($taskResult.checks) checks"
          }
      - run: dotnet publish -c Release -r win-x64 --self-contained true -o artifacts/server/windows-x64
      - run: pnpm run build:win
        working-directory: desktop
      - name: Publish Windows installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$taskProject = Get-Content CfcPilot.csproj
          $taskVersion = $taskProject.Project.PropertyGroup.Version
          $taskTag = "v$taskVersion"
          $taskSource = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not identify checked-out source" }
          $taskInstaller = Get-Item "artifacts/desktop/CFC-Plus-Instalador-$taskVersion-x64.exe"
          $taskChecksum = "$($taskInstaller.FullName).sha256"
          $taskHash = (Get-FileHash $taskInstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$taskHash  $($taskInstaller.Name)" | Set-Content $taskChecksum -Encoding ascii
          gh release view $taskTag --repo $env:GITHUB_REPOSITORY --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create $taskTag --repo $env:GITHUB_REPOSITORY --target $taskSource --title "CFC+ $taskVersion - piloto GP" --notes "Cliente Windows x64 e imagem de servidor do piloto. Consulte docs/PORTAINER_PILOTO_GP.md antes de instalar. Perfis locais persistentes e seleção de certificado disponíveis; captura biométrica e homologação de equipamentos ainda exigem validação. Instalador ainda sem assinatura comercial."
            if ($LASTEXITCODE -ne 0) { throw "Could not create release" }
          }
          # Refuse overwriting a version already distributed.
          gh release upload $taskTag $taskInstaller.FullName $taskChecksum --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not upload installer; use a new version instead of overwriting assets" }
