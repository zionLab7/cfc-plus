name: Publish versioned images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --nologo
      - run: dotnet bin/Debug/net10.0/CfcPilot.dll --self-test-finance
      - run: dotnet bin/Debug/net10.0/CfcPilot.dll --self-test-commercial
      - run: node tests/central-http.mjs
      - run: dotnet bin/Debug/net10.0/CfcPilot.dll --self-test-community
      - name: Build and verify Linux browser
        run: |
          docker build --target browser-check -t cfc-browser-test .
          docker run --rm --init --shm-size=1g --security-opt seccomp=infra/production/chromium-seccomp.json -e CFC_TEST_USERNS=1 --entrypoint xvfb-run cfc-browser-test -a node /app/tools/NativePortalChecks.cjs /tmp/native-check /opt/electron/electron
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "value=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' CfcPilot.csproj)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/cfc-plus:${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: browser
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/cfc-plus:${{ steps.version.outputs.value }}-browser
