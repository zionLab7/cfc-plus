# One central Portainer Docker Standalone stack for ALL schools. Never run a second replica on this volume.
services:
  app:
    image: ${CFC_BROWSER_IMAGE:?Define the tested browser image or digest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    environment:
      CFC_MULTI_TENANT: "true"
      CFC_CENTRAL_BROWSER_PROFILES: ${CFC_CENTRAL_BROWSER_PROFILES:-12}
      CFC_SUPPORT_EMAIL: ${CFC_SUPPORT_EMAIL:-}
      CFC_TRUSTED_PROXY: ${TRAEFIK_IP:?Define the actual Traefik IP on the proxy network}
      AllowedHosts: ${CFC_DOMAIN:?Define the central hostname};localhost;127.0.0.1
      CFC_ADMIN_LOGIN: ${CFC_ADMIN_LOGIN:-admin}
      NativePortal__MaxProfiles: ${CFC_BROWSER_PROFILES:-6}
      DOTNET_GCHeapHardLimitPercent: "70"
    volumes:
      - data:/data
    networks:
      - proxy
    security_opt:
      - seccomp=${CHROMIUM_SECCOMP_PATH:?Install the Chromium seccomp profile on the Docker host}
    shm_size: 1gb
    mem_limit: ${CFC_MEMORY_LIMIT:-16g}
    cpus: ${CFC_CPUS:-6.0}
    pids_limit: 512
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-cfc-proxy}
      traefik.http.routers.cfc-central.rule: Host(`${CFC_DOMAIN}`)
      traefik.http.routers.cfc-central.entrypoints: websecure
      traefik.http.routers.cfc-central.tls: "true"
      traefik.http.routers.cfc-central.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.cfc-central.loadbalancer.server.port: "8080"
volumes:
  data:
    name: ${CFC_DATA_VOLUME:-cfc-central-data}
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-cfc-proxy}
