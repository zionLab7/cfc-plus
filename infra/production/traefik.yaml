# Optional bootstrap for a VPS without Traefik. Configure DNS first. Do not duplicate an existing proxy.
services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=cfc-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Define ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificates:/certificates
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  certificates:
networks:
  proxy:
    name: cfc-proxy
    ipam:
      config:
        - subnet: 172.30.0.0/24
