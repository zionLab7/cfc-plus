# GP one-month pilot: ONE Docker Standalone stack, reusing an EXISTING Traefik.
# Publish the tested browser image first. No Docker socket or host ports are exposed.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ${CFC_BROWSER_IMAGE:?Publish and set the tested browser image or digest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    environment:
      CFC_MULTI_TENANT: "true"
      CFC_CENTRAL_BROWSER_PROFILES: ${CFC_CENTRAL_BROWSER_PROFILES:-1}
      CFC_SUPPORT_EMAIL: ${CFC_SUPPORT_EMAIL:-}
      CFC_TRUSTED_PROXY: ${TRAEFIK_IP:?Set the existing Traefik IP on its Docker network}
      AllowedHosts: ${CFC_DOMAIN:?Set the hostname without https};localhost;127.0.0.1
      CFC_ADMIN_LOGIN: ${CFC_ADMIN_LOGIN:-admin}
      NativePortal__MaxProfiles: ${CFC_BROWSER_PROFILES:-1}
      DOTNET_GCHeapHardLimitPercent: "70"
    volumes:
      - data:/data
    networks:
      - proxy
      - backend
    security_opt:
      # Inline copy of chromium-seccomp.json; no file mount into Portainer required.
      - 'seccomp={"defaultAction":"SCMP_ACT_ERRNO","archMap":[{"architecture":"SCMP_ARCH_X86_64","subArchitectures":["SCMP_ARCH_X86","SCMP_ARCH_X32"]},{"architecture":"SCMP_ARCH_AARCH64","subArchitectures":["SCMP_ARCH_ARM"]},{"architecture":"SCMP_ARCH_MIPS64","subArchitectures":["SCMP_ARCH_MIPS","SCMP_ARCH_MIPS64N32"]},{"architecture":"SCMP_ARCH_MIPS64N32","subArchitectures":["SCMP_ARCH_MIPS","SCMP_ARCH_MIPS64"]},{"architecture":"SCMP_ARCH_MIPSEL64","subArchitectures":["SCMP_ARCH_MIPSEL","SCMP_ARCH_MIPSEL64N32"]},{"architecture":"SCMP_ARCH_MIPSEL64N32","subArchitectures":["SCMP_ARCH_MIPSEL","SCMP_ARCH_MIPSEL64"]},{"architecture":"SCMP_ARCH_S390X","subArchitectures":["SCMP_ARCH_S390"]}],"syscalls":[{"comment":"Allow create user namespaces","names":["clone","setns","unshare"],"action":"SCMP_ACT_ALLOW","args":[],"includes":{},"excludes":{}},{"names":["accept","accept4","access","adjtimex","alarm","bind","brk","capget","capset","chdir","chmod","chown","chown32","clock_adjtime","clock_adjtime64","clock_getres","clock_getres_time64","clock_gettime","clock_gettime64","clock_nanosleep","clock_nanosleep_time64","close","connect","copy_file_range","creat","dup","dup2","dup3","epoll_create","epoll_create1","epoll_ctl","epoll_ctl_old","epoll_pwait","epoll_wait","epoll_wait_old","eventfd","eventfd2","execve","execveat","exit","exit_group","faccessat","fadvise64","fadvise64_64","fallocate","fanotify_mark","fchdir","fchmod","fchmodat","fchown","fchown32","fchownat","fcntl","fcntl64","fdatasync","fgetxattr","flistxattr","flock","fork","fremovexattr","fsetxattr","fstat","fstat64","fstatat64","fstatfs","fstatfs64","fsync","ftruncate","ftruncate64","futex","futex_time64","futimesat","getcpu","getcwd","getdents","getdents64","getegid","getegid32","geteuid","geteuid32","getgid","getgid32","getgroups","getgroups32","getitimer","getpeername","getpgid","getpgrp","getpid","getppid","getpriority","getrandom","getresgid","getresgid32","getresuid","getresuid32","getrlimit","get_robust_list","g