# GP one-month pilot: ONE Docker Standalone stack, reusing an EXISTING Traefik.
# Publish the tested browser image first. No Docker socket or host ports are exposed.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ${CFC_BROWSER_IMAGE:?Publish and set the tested browser image or digest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    environment:
      CFC_MULTI_TENANT: "true"
      CFC_CENTRAL_BROWSER_PROFILES: ${CFC_CENTRAL_BROWSER_PROFILES:-1}
      CFC_SUPPORT_EMAIL: ${CFC_SUPPORT_EMAIL:-}
      CFC_TRUSTED_PROXY: ${TRAEFIK_IP:?Set the existing Traefik IP on its Docker network}
      AllowedHosts: ${CFC_DOMAIN:?Set the hostname without https};localhost;127.0.0.1
      CFC_ADMIN_LOGIN: ${CFC_ADMIN_LOGIN:-admin}
      NativePortal__MaxProfiles: ${CFC_BROWSER_PROFILES:-1}
      DOTNET_GCHeapHardLimitPercent: "70"
    volumes:
      - data:/data
    networks:
      - proxy
      - backend
    security_opt:
      # Inline copy of chromium-seccomp.json; no file mount into Portainer required.
      - seccomp=${CHROMIUM_SECCOMP_PATH:?Set the readable profile path in the Portainer container}
    shm_size: 1gb
    mem_limit: ${CFC_MEMORY_LIMIT:-3g}
    cpus: ${CFC_CPUS:-1.0}
    pids_limit: 512
    stop_grace_period: 45s
    logging: *logging
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the existing external Docker network}
      traefik.http.routers.cfc-gp.rule: Host(`${CFC_DOMAIN}`)
      traefik.http.routers.cfc-gp.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.cfc-gp.tls: "true"
      traefik.http.routers.cfc-gp.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?Set the existing certificate resolver}
      traefik.http.routers.cfc-gp.service: cfc-gp
      traefik.http.services.cfc-gp.loadbalancer.server.port: "8080"

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Generate a private 64-character hex key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD:?Generate a private hex password}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: cfc-gp-pilot
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: cfc-gp-pilot
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: CFC+
      CONFIG_SESSION_PHONE_NAME: Chrome
      LANGUAGE: pt-BR
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution-instances:/evolution/instances
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${EVOLUTION_MEMORY_LIMIT:-768m}
    cpus: ${EVOLUTION_CPUS:-0.5}
    pids_limit: 256
    stop_grace_period: 30s
    logging: *logging
    labels:
      traefik.enable: "false"

  postgres:
    # This PostgreSQL belongs ONLY to Evolution; schools still use their own SQLite.
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?Generate a private hex password}
    volumes:
      - evolution-postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-0.2}
    pids_limit: 128
    logging: *logging
    labels:
      traefik.enable: "false"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - evolution-redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.1}
    pids_limit: 128
    logging: *logging
    labels:
      traefik.enable: "false"

volumes:
  data:
    name: ${CFC_DATA_VOLUME:-cfc-gp-central-data}
  evolution-instances:
    name: ${EVOLUTION_INSTANCES_VOLUME:-cfc-gp-evolution-instances}
  evolution-postgres:
    name: ${EVOLUTION_POSTGRES_VOLUME:-cfc-gp-evolution-postgres}
  evolution-redis:
    name: ${EVOLUTION_REDIS_VOLUME:-cfc-gp-evolution-redis}

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set the existing external Docker network}
  backend:
    # No published ports; outbound connectivity is required for WhatsApp.
    driver: bridge
